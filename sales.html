<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales - CF Food and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h5 class="mb-0">Sales History</h5>
          <small class="text-muted">View and search completed sales</small>
        </div>
        <a href="pos.html" class="btn btn-success">
          <i class="fas fa-cash-register me-1"></i> Open POS
        </a>
      </div>

      <!-- Filters -->
      <div class="table-card mb-4">
        <div class="p-3">
          <div class="row g-2">
            <div class="col-md-3">
              <input type="text" class="form-control" id="searchSales" placeholder="Search receipt #, cashier, customer...">
            </div>
            <div class="col-md-2">
              <select class="form-select" id="filterPayment">
                <option value="">All Payments</option>
                <option value="cash">Cash</option>
                <option value="bank_transfer">Transfer</option>
                <option value="pos">POS</option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="date" class="form-control" id="filterFrom">
            </div>
            <div class="col-md-2">
              <input type="date" class="form-control" id="filterTo">
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" onclick="loadSales()">
                <i class="fas fa-filter me-1"></i> Filter
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Total Sales</div>
            <div class="stat-value" id="sumCount">0</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value text-success" id="sumRevenue">₦0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Total Profit</div>
            <div class="stat-value text-primary" id="sumProfit">₦0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Avg. Sale</div>
            <div class="stat-value" id="sumAvg">₦0.00</div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="card-header">
          <i class="fas fa-receipt me-2"></i>Transactions
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>Receipt #</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Cashier</th>
                <th>Payment</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Pay Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="salesTableBody">
              <tr><td colspan="10" class="text-center py-4 text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Sale Detail Modal -->
  <div class="modal fade" id="saleDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Sale Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="saleDetailContent"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    let allSales = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      Layout.render('sales');
      Layout.setPageTitle('Sales History');
      await loadSales();
    });

    function formatCurrency(n) {
      return '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString('en-NG');
    }

    async function loadSales() {
      try {
        let query = db.collection('sales').orderBy('createdAt', 'desc').limit(200);
        const snapshot = await query.get();
        allSales = [];
        snapshot.forEach(doc => allSales.push({ id: doc.id, ...doc.data() }));

        // Client-side filters
        let list = [...allSales];
        const search = document.getElementById('searchSales').value.toLowerCase();
        const payment = document.getElementById('filterPayment').value;
        const from = document.getElementById('filterFrom').value;
        const to = document.getElementById('filterTo').value;

        if (search) {
          list = list.filter(s =>
            (s.transactionNumber || '').toLowerCase().includes(search) ||
            (s.cashierName || '').toLowerCase().includes(search) ||
            (s.customerName || '').toLowerCase().includes(search)
          );
        }
        if (payment) list = list.filter(s => s.paymentMethod === payment);
        if (from) {
          const fromDate = new Date(from);
          list = list.filter(s => {
            const d = s.createdAt?.toDate ? s.createdAt.toDate() : new Date(s.createdAt);
            return d >= fromDate;
          });
        }
        if (to) {
          const toDate = new Date(to);
          toDate.setHours(23, 59, 59);
          list = list.filter(s => {
            const d = s.createdAt?.toDate ? s.createdAt.toDate() : new Date(s.createdAt);
            return d <= toDate;
          });
        }

        renderSales(list);
        updateSummary(list);
      } catch (error) {
        console.error(error);
        document.getElementById('salesTableBody').innerHTML =
          '<tr><td colspan="10" class="text-center text-danger py-4">Failed to load sales</td></tr>';
      }
    }

    function updateSummary(list) {
      const count = list.length;
      const revenue = list.reduce((s, x) => s + (x.totalAmount || 0), 0);
      const profit = list.reduce((s, x) => s + (x.profit || 0), 0);
      document.getElementById('sumCount').textContent = count;
      document.getElementById('sumRevenue').textContent = formatCurrency(revenue);
      document.getElementById('sumProfit').textContent = formatCurrency(profit);
      document.getElementById('sumAvg').textContent = formatCurrency(count ? revenue / count : 0);
    }

    function renderSales(list) {
      const tbody = document.getElementById('salesTableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">No sales found</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(s => {
        const bal = s.balance || 0;
        const payStatus = s.paymentStatus || (bal > 0 ? 'partial' : 'paid');
        const statusBadge = payStatus === 'paid' ? 'bg-success' : (payStatus === 'partial' ? 'bg-warning text-dark' : 'bg-danger');
        return `
        <tr>
          <td class="fw-semibold">${s.transactionNumber || '—'}</td>
          <td class="small">${formatDate(s.createdAt)}</td>
          <td>${s.customerName || 'Walk-in'}</td>
          <td>${s.cashierName || '—'}</td>
          <td><span class="badge bg-secondary">${s.paymentMethod || '—'}</span></td>
          <td class="fw-semibold">${formatCurrency(s.totalAmount)}</td>
          <td>${formatCurrency(s.amountPaid)}</td>
          <td class="${bal > 0 ? 'text-danger fw-bold' : ''}">${formatCurrency(bal)}</td>
          <td><span class="badge ${statusBadge}">${payStatus}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="viewSale('${s.id}')" title="View">
              <i class="fas fa-eye"></i>
            </button>
            ${bal > 0 ? `<button class="btn btn-sm btn-success" onclick="settleSale('${s.id}')" title="Collect Balance">
              <i class="fas fa-money-bill"></i>
            </button>` : ''}
          </td>
        </tr>`;
      }).join('');
    }

    function viewSale(id) {
      const s = allSales.find(x => x.id === id);
      if (!s) return;
      const items = s.items || [];
      const bal = s.balance || 0;
      const payStatus = s.paymentStatus || (bal > 0 ? 'partial' : 'paid');
      document.getElementById('saleDetailContent').innerHTML = `
        <div class="row mb-3">
          <div class="col-md-6">
            <p class="mb-1"><strong>Receipt:</strong> ${s.transactionNumber}</p>
            <p class="mb-1"><strong>Date:</strong> ${formatDate(s.createdAt)}</p>
            <p class="mb-1"><strong>Cashier:</strong> ${s.cashierName}</p>
            <p class="mb-1"><strong>Customer:</strong> ${s.customerName || 'Walk-in'}</p>
          </div>
          <div class="col-md-6">
            <p class="mb-1"><strong>Payment Method:</strong> ${s.paymentMethod}</p>
            <p class="mb-1"><strong>Total:</strong> ${formatCurrency(s.totalAmount)}</p>
            <p class="mb-1"><strong>Amount Paid:</strong> ${formatCurrency(s.amountPaid)}</p>
            <p class="mb-1"><strong>Balance Due:</strong> <span class="${bal > 0 ? 'text-danger fw-bold' : 'text-success'}">${formatCurrency(bal)}</span></p>
            <p class="mb-1"><strong>Payment Status:</strong> <span class="badge ${payStatus === 'paid' ? 'bg-success' : (payStatus === 'partial' ? 'bg-warning text-dark' : 'bg-danger')}">${payStatus}</span></p>
            <p class="mb-1"><strong>Profit:</strong> <span class="text-success">${formatCurrency(s.profit)}</span></p>
          </div>
        </div>
        <table class="table table-sm">
          <thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.productName}</td>
                <td>${i.quantity}</td>
                <td>${formatCurrency(i.unitPrice)}</td>
                <td>${formatCurrency(i.total)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${bal > 0 ? `<div class="mt-3 text-end">
          <button class="btn btn-success" onclick="bootstrap.Modal.getInstance(document.getElementById('saleDetailModal')).hide(); settleSale('${s.id}')">
            <i class="fas fa-money-bill me-1"></i> Collect Outstanding Balance
          </button>
        </div>` : ''}
      `;
      new bootstrap.Modal(document.getElementById('saleDetailModal')).show();
    }

    async function settleSale(id) {
      const s = allSales.find(x => x.id === id);
      if (!s || !(s.balance > 0)) return;

      const bal = s.balance;
      const input = prompt(`Outstanding balance: ${formatCurrency(bal)}\n\nEnter amount customer is paying now:`, bal);
      if (input === null) return;

      const payNow = parseFloat(input);
      if (isNaN(payNow) || payNow <= 0) {
        alert('Please enter a valid amount.');
        return;
      }
      if (payNow > bal) {
        alert('Amount cannot be more than the outstanding balance.');
        return;
      }

      try {
        const newPaid = (s.amountPaid || 0) + payNow;
        const newBalance = Math.max(0, (s.totalAmount || 0) - newPaid);
        const newStatus = newBalance <= 0 ? 'paid' : 'partial';

        await db.collection('sales').doc(id).update({
          amountPaid: newPaid,
          balance: newBalance,
          paymentStatus: newStatus,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Reduce customer balance
        if (s.customerId) {
          await db.collection('customers').doc(s.customerId).update({
            balance: firebase.firestore.FieldValue.increment(-payNow),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        await Auth.logAction('sale_settle', `Settled ${formatCurrency(payNow)} on ${s.transactionNumber}. Remaining: ${formatCurrency(newBalance)}`);
        alert(newBalance <= 0 ? 'Sale fully paid!' : `Payment recorded. Remaining balance: ${formatCurrency(newBalance)}`);
        await loadSales();
      } catch (e) {
        console.error(e);
        alert('Failed to record payment.');
      }
    }

    document.getElementById('searchSales').addEventListener('input', () => loadSales());
  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").then(function(reg) {
      console.log("SW registered", reg.scope);
    }).catch(function(err) {
      console.log("SW registration failed", err);
    });
  }
</script>
</body>
</html>
