<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - CF Foods and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h5 class="mb-0">Suppliers</h5>
          <small class="text-muted">Manage your suppliers</small>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#supplierModal" onclick="openAdd()" data-role="admin,manager">
          <i class="fas fa-plus me-1"></i> Add Supplier
        </button>
      </div>

      <div class="table-card mb-3">
        <div class="p-3">
          <input type="text" class="form-control" id="searchInput" placeholder="Search by business name, contact, phone...">
        </div>
      </div>

      <div class="table-card">
        <div class="card-header">
          <i class="fas fa-industry me-2"></i>Supplier List <span class="badge bg-secondary" id="countBadge">0</span>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>Business Name</th>
                <th>Contact Person</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Balance (Owed)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Supplier Modal -->
  <div class="modal fade" id="supplierModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Supplier</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formAlert" class="alert d-none"></div>
          <form id="supplierForm">
            <input type="hidden" id="supplierId">
            <div class="mb-3">
              <label class="form-label">Business Name *</label>
              <input type="text" class="form-control" id="sName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contact Person</label>
              <input type="text" class="form-control" id="sContact">
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" id="sPhone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="sEmail">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="sAddress" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="saveBtn">Save Supplier</button>
        </div>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Purchase History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="historyContent">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/suppliers.js"></script>
  <script>
    let editingId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init(['admin', 'manager']);
      Layout.render('suppliers');
      Layout.setPageTitle('Suppliers');
      await load();
    });

    async function load() {
      await Suppliers.load();
      render(Suppliers.all);
    }

    function render(list) {
      document.getElementById('countBadge').textContent = list.length;
      const tbody = document.getElementById('tableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No suppliers yet</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(s => `
        <tr>
          <td class="fw-semibold">${s.businessName}</td>
          <td>${s.contactPerson || '—'}</td>
          <td>${s.phone || '—'}</td>
          <td>${s.email || '—'}</td>
          <td class="${(s.balance || 0) > 0 ? 'text-danger fw-semibold' : ''}">${Suppliers.formatCurrency(s.balance)}</td>
          <td>
            <button class="btn btn-sm btn-outline-info me-1" onclick="viewHistory('${s.id}', '${(s.businessName || '').replace(/'/g, "\\'")}')" title="History">
              <i class="fas fa-history"></i>
            </button>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit('${s.id}')" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="remove('${s.id}', '${(s.businessName || '').replace(/'/g, "\\'")}')" data-role="admin" title="Delete">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
      Auth.updateUI();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = Suppliers.all.filter(s =>
        (s.businessName || '').toLowerCase().includes(q) ||
        (s.contactPerson || '').toLowerCase().includes(q) ||
        (s.phone || '').includes(q)
      );
      render(filtered);
    });

    function openAdd() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Supplier';
      document.getElementById('supplierForm').reset();
      document.getElementById('supplierId').value = '';
      document.getElementById('formAlert').classList.add('d-none');
    }

    function openEdit(id) {
      const s = Suppliers.all.find(x => x.id === id);
      if (!s) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Supplier';
      document.getElementById('supplierId').value = id;
      document.getElementById('sName').value = s.businessName || '';
      document.getElementById('sContact').value = s.contactPerson || '';
      document.getElementById('sPhone').value = s.phone || '';
      document.getElementById('sEmail').value = s.email || '';
      document.getElementById('sAddress').value = s.address || '';
      document.getElementById('formAlert').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('supplierModal')).show();
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const name = document.getElementById('sName').value.trim();
      if (!name) {
        showFormAlert('Business name is required.', 'danger');
        return;
      }
      const data = {
        businessName: name,
        contactPerson: document.getElementById('sContact').value,
        phone: document.getElementById('sPhone').value,
        email: document.getElementById('sEmail').value,
        address: document.getElementById('sAddress').value
      };
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const result = editingId
        ? await Suppliers.update(editingId, data)
        : await Suppliers.create(data);

      showFormAlert(result.message, result.success ? 'success' : 'danger');
      btn.disabled = false;
      btn.textContent = 'Save Supplier';

      if (result.success) {
        await load();
        setTimeout(() => bootstrap.Modal.getInstance(document.getElementById('supplierModal'))?.hide(), 700);
      }
    });

    function showFormAlert(msg, type) {
      const el = document.getElementById('formAlert');
      el.className = `alert alert-${type}`;
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    async function remove(id, name) {
      if (!confirm(`Delete supplier "${name}"?`)) return;
      const result = await Suppliers.delete(id, name);
      alert(result.message);
      if (result.success) await load();
    }

    async function viewHistory(id, name) {
      document.getElementById('historyContent').innerHTML = 'Loading...';
      new bootstrap.Modal(document.getElementById('historyModal')).show();
      try {
        const list = await Suppliers.getPurchaseHistory(id);
        if (list.length === 0) {
          document.getElementById('historyContent').innerHTML = `<p class="text-muted">No purchases found for <strong>${name}</strong>.</p>`;
          return;
        }
        document.getElementById('historyContent').innerHTML = `
          <p class="mb-2">Purchase history for <strong>${name}</strong></p>
          <table class="table table-sm">
            <thead><tr><th>Purchase #</th><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead>
            <tbody>
              ${list.map(p => `
                <tr>
                  <td>${p.purchaseNumber || '—'}</td>
                  <td>${p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString('en-NG') : '—'}</td>
                  <td>${Suppliers.formatCurrency(p.totalAmount)}</td>
                  <td>${Suppliers.formatCurrency(p.amountPaid)}</td>
                  <td>${Suppliers.formatCurrency(p.balance)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        document.getElementById('historyContent').innerHTML = '<p class="text-danger">Failed to load history.</p>';
      }
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
