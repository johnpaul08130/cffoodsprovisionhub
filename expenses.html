<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - CF Foods and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h5 class="mb-0">Expenses</h5>
          <small class="text-muted">Track business expenses</small>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#expenseModal" onclick="openAdd()">
          <i class="fas fa-plus me-1"></i> Add Expense
        </button>
      </div>

      <!-- Summary Cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Total Expenses</div>
            <div class="stat-value text-danger" id="sumTotal">₦0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">This Month</div>
            <div class="stat-value" id="sumMonth">₦0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Records</div>
            <div class="stat-value" id="sumCount">0</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Top Category</div>
            <div class="stat-value" style="font-size:1.1rem" id="sumTopCat">—</div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="table-card mb-3">
        <div class="p-3">
          <div class="row g-2">
            <div class="col-md-4">
              <input type="text" class="form-control" id="searchInput" placeholder="Search description...">
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterCategory">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="date" class="form-control" id="filterFrom">
            </div>
            <div class="col-md-2">
              <input type="date" class="form-control" id="filterTo">
            </div>
            <div class="col-md-1">
              <button class="btn btn-outline-secondary w-100" onclick="applyFilters()">
                <i class="fas fa-filter"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="card-header">
          <i class="fas fa-money-bill-wave me-2"></i>Expense List
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Payment</th>
                <th>Recorded By</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Expense Modal -->
  <div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formAlert" class="alert d-none"></div>
          <form id="expenseForm">
            <input type="hidden" id="expenseId">
            <div class="mb-3">
              <label class="form-label">Category *</label>
              <select class="form-select" id="eCategory" required>
                <option value="">— Select —</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Amount (₦) *</label>
              <input type="number" class="form-control" id="eAmount" min="0" step="0.01" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="eDesc" rows="2" placeholder="Optional details..."></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="ePayment">
                <option value="cash">Cash</option>
                <option value="bank_transfer">Bank Transfer</option>
                <option value="pos">POS</option>
                <option value="other">Other</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="saveBtn">Save Expense</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/expenses.js"></script>
  <script>
    let editingId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init(['admin', 'manager']);
      Layout.render('expenses');
      Layout.setPageTitle('Expenses');

      // Populate category selects
      const catOpts = Expenses.CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('eCategory').innerHTML = '<option value="">— Select —</option>' + catOpts;
      document.getElementById('filterCategory').innerHTML = '<option value="">All Categories</option>' + catOpts;

      await load();
    });

    async function load() {
      await Expenses.load();
      render(Expenses.all);
      updateSummary(Expenses.all);
    }

    function updateSummary(list) {
      const total = list.reduce((s, x) => s + (x.amount || 0), 0);
      document.getElementById('sumTotal').textContent = Expenses.formatCurrency(total);
      document.getElementById('sumCount').textContent = list.length;

      // This month
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthTotal = list
        .filter(x => {
          const d = x.createdAt?.toDate ? x.createdAt.toDate() : new Date(x.createdAt);
          return d >= monthStart;
        })
        .reduce((s, x) => s + (x.amount || 0), 0);
      document.getElementById('sumMonth').textContent = Expenses.formatCurrency(monthTotal);

      // Top category
      const byCat = {};
      list.forEach(x => {
        byCat[x.category] = (byCat[x.category] || 0) + (x.amount || 0);
      });
      const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
      document.getElementById('sumTopCat').textContent = top ? top[0] : '—';
    }

    function render(list) {
      const tbody = document.getElementById('tableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No expenses yet</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(e => `
        <tr>
          <td class="small">${Expenses.formatDate(e.createdAt)}</td>
          <td><span class="badge bg-secondary">${e.category}</span></td>
          <td>${e.description || '—'}</td>
          <td class="fw-semibold text-danger">${Expenses.formatCurrency(e.amount)}</td>
          <td>${e.paymentMethod || '—'}</td>
          <td class="small">${e.createdByName || '—'}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit('${e.id}')">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="remove('${e.id}')" data-role="admin">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
      Auth.updateUI();
    }

    function applyFilters() {
      let list = [...Expenses.all];
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('filterCategory').value;
      const from = document.getElementById('filterFrom').value;
      const to = document.getElementById('filterTo').value;

      if (q) list = list.filter(e => (e.description || '').toLowerCase().includes(q) || (e.category || '').toLowerCase().includes(q));
      if (cat) list = list.filter(e => e.category === cat);
      if (from) {
        const fromDate = new Date(from);
        list = list.filter(e => {
          const d = e.createdAt?.toDate ? e.createdAt.toDate() : new Date(e.createdAt);
          return d >= fromDate;
        });
      }
      if (to) {
        const toDate = new Date(to);
        toDate.setHours(23, 59, 59);
        list = list.filter(e => {
          const d = e.createdAt?.toDate ? e.createdAt.toDate() : new Date(e.createdAt);
          return d <= toDate;
        });
      }
      render(list);
      updateSummary(list);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function openAdd() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Expense';
      document.getElementById('expenseForm').reset();
      document.getElementById('expenseId').value = '';
      document.getElementById('formAlert').classList.add('d-none');
    }

    function openEdit(id) {
      const e = Expenses.all.find(x => x.id === id);
      if (!e) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Expense';
      document.getElementById('expenseId').value = id;
      document.getElementById('eCategory').value = e.category || '';
      document.getElementById('eAmount').value = e.amount || '';
      document.getElementById('eDesc').value = e.description || '';
      document.getElementById('ePayment').value = e.paymentMethod || 'cash';
      document.getElementById('formAlert').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('expenseModal')).show();
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const data = {
        category: document.getElementById('eCategory').value,
        amount: document.getElementById('eAmount').value,
        description: document.getElementById('eDesc').value,
        paymentMethod: document.getElementById('ePayment').value
      };
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const result = editingId
        ? await Expenses.update(editingId, data)
        : await Expenses.create(data);

      const alertBox = document.getElementById('formAlert');
      alertBox.className = `alert alert-${result.success ? 'success' : 'danger'}`;
      alertBox.textContent = result.message;
      alertBox.classList.remove('d-none');

      btn.disabled = false;
      btn.textContent = 'Save Expense';

      if (result.success) {
        await load();
        setTimeout(() => bootstrap.Modal.getInstance(document.getElementById('expenseModal'))?.hide(), 700);
      }
    });

    async function remove(id) {
      if (!confirm('Delete this expense?')) return;
      const result = await Expenses.delete(id);
      alert(result.message);
      if (result.success) await load();
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
