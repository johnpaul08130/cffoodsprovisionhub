<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - CF Foods and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h5 class="mb-0">Reports</h5>
          <small class="text-muted">Business insights and exports</small>
        </div>
      </div>

      <!-- Report type selector -->
      <div class="table-card mb-4">
        <div class="p-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Report Type</label>
              <select class="form-select" id="reportType">
                <option value="sales">Sales Report</option>
                <option value="profit">Profit Report</option>
                <option value="products">Product Performance</option>
                <option value="cashier">Cashier Performance</option>
                <option value="payment">Sales by Payment Method</option>
                <option value="purchases">Purchase Report</option>
                <option value="expenses">Expense Report</option>
                <option value="inventory">Inventory Value</option>
                <option value="lowstock">Low Stock Report</option>
                <option value="expiry">Expiry Report</option>
                <option value="customers">Customer Report</option>
                <option value="suppliers">Supplier Report</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">From</label>
              <input type="date" class="form-control" id="dateFrom">
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">To</label>
              <input type="date" class="form-control" id="dateTo">
            </div>
            <div class="col-md-2">
              <button class="btn btn-success w-100" onclick="runReport()">
                <i class="fas fa-play me-1"></i> Run Report
              </button>
            </div>
            <div class="col-md-3">
              <div class="btn-group w-100">
                <button class="btn btn-outline-secondary" onclick="exportCSV()" title="Export CSV">
                  <i class="fas fa-file-csv me-1"></i> CSV
                </button>
                <button class="btn btn-outline-secondary" onclick="printCurrent()" title="Print">
                  <i class="fas fa-print me-1"></i> Print
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Summary cards -->
      <div class="row g-3 mb-4" id="summaryCards"></div>

      <!-- Results -->
      <div class="table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span id="reportTitle"><i class="fas fa-chart-bar me-2"></i>Select a report and click Run</span>
        </div>
        <div class="table-responsive">
          <div id="reportContent">
            <p class="text-muted text-center py-5">No report loaded yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reports.js"></script>
  <script>
    let currentReportType = '';
    let currentData = null;
    let csvHeaders = [];
    let csvRows = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init(['admin', 'manager']);
      Layout.render('reports');
      Layout.setPageTitle('Reports');

      // Default date range: this month
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      document.getElementById('dateFrom').value = first.toISOString().slice(0, 10);
      document.getElementById('dateTo').value = now.toISOString().slice(0, 10);
    });

    function getDates() {
      return {
        from: Reports.parseDate(document.getElementById('dateFrom').value),
        to: Reports.parseDate(document.getElementById('dateTo').value)
      };
    }

    function setSummary(cards) {
      document.getElementById('summaryCards').innerHTML = cards.map(c =>
        '<div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">' + c.label +
        '</div><div class="stat-value ' + (c.cls || '') + '">' + c.value + '</div></div></div>'
      ).join('');
    }

    async function runReport() {
      const type = document.getElementById('reportType').value;
      currentReportType = type;
      const { from, to } = getDates();
      const content = document.getElementById('reportContent');
      const title = document.getElementById('reportTitle');
      content.innerHTML = '<p class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading...</p>';

      try {
        if (type === 'sales') {
          const sales = await Reports.loadSales(from, to);
          const report = Reports.salesReport(sales);
          currentData = report;
          title.innerHTML = '<i class="fas fa-shopping-cart me-2"></i>Sales Report';
          setSummary([
            { label: 'Transactions', value: report.summary.count },
            { label: 'Revenue', value: Reports.formatCurrency(report.summary.revenue), cls: 'text-success' },
            { label: 'Profit', value: Reports.formatCurrency(report.summary.profit), cls: 'text-primary' },
            { label: 'Outstanding', value: Reports.formatCurrency(report.summary.balance), cls: 'text-danger' }
          ]);
          csvHeaders = ['Receipt', 'Date', 'Customer', 'Cashier', 'Payment', 'Total', 'Paid', 'Balance', 'Profit', 'Status'];
          csvRows = report.rows.map(s => [
            s.transactionNumber, Reports.formatDateTime(s.createdAt), s.customerName, s.cashierName,
            s.paymentMethod, s.totalAmount, s.amountPaid, s.balance || 0, s.profit, s.paymentStatus || s.status
          ]);
          content.innerHTML = buildTable(csvHeaders, report.rows.map(s => [
            s.transactionNumber, Reports.formatDate(s.createdAt), s.customerName || 'Walk-in', s.cashierName,
            s.paymentMethod, Reports.formatCurrency(s.totalAmount), Reports.formatCurrency(s.amountPaid),
            Reports.formatCurrency(s.balance || 0), Reports.formatCurrency(s.profit), s.paymentStatus || s.status
          ]));
        }
        else if (type === 'profit') {
          const [sales, expenses] = await Promise.all([
            Reports.loadSales(from, to), Reports.loadExpenses(from, to)
          ]);
          const report = Reports.profitReport(sales, expenses);
          currentData = report;
          title.innerHTML = '<i class="fas fa-chart-line me-2"></i>Profit Report';
          setSummary([
            { label: 'Revenue', value: Reports.formatCurrency(report.revenue), cls: 'text-success' },
            { label: 'Gross Profit', value: Reports.formatCurrency(report.grossProfit), cls: 'text-primary' },
            { label: 'Expenses', value: Reports.formatCurrency(report.expenses), cls: 'text-danger' },
            { label: 'Net Profit', value: Reports.formatCurrency(report.netProfit), cls: report.netProfit >= 0 ? 'text-success' : 'text-danger' }
          ]);
          csvHeaders = ['Metric', 'Value'];
          csvRows = [
            ['Revenue', report.revenue], ['Gross Profit', report.grossProfit],
            ['Expenses', report.expenses], ['Net Profit', report.netProfit],
            ['Sales Count', report.salesCount], ['Expense Count', report.expenseCount]
          ];
          content.innerHTML = '<table class="table table-bordered mb-0"><tbody>' +
            csvRows.map(r => '<tr><td class="fw-semibold">' + r[0] + '</td><td>' +
              (typeof r[1] === 'number' && r[0] !== 'Sales Count' && r[0] !== 'Expense Count' ? Reports.formatCurrency(r[1]) : r[1]) +
              '</td></tr>').join('') + '</tbody></table>';
        }
        else if (type === 'products') {
          const sales = await Reports.loadSales(from, to);
          const list = Reports.productPerformance(sales);
          currentData = list;
          title.innerHTML = '<i class="fas fa-box me-2"></i>Product Performance';
          setSummary([
            { label: 'Products Sold', value: list.length },
            { label: 'Total Qty', value: list.reduce((s, x) => s + x.qtySold, 0) },
            { label: 'Revenue', value: Reports.formatCurrency(list.reduce((s, x) => s + x.revenue, 0)), cls: 'text-success' },
            { label: 'Profit', value: Reports.formatCurrency(list.reduce((s, x) => s + x.profit, 0)), cls: 'text-primary' }
          ]);
          csvHeaders = ['Product', 'Qty Sold', 'Revenue', 'Profit'];
          csvRows = list.map(p => [p.productName, p.qtySold, p.revenue, p.profit]);
          content.innerHTML = buildTable(csvHeaders, list.map(p => [
            p.productName, p.qtySold, Reports.formatCurrency(p.revenue), Reports.formatCurrency(p.profit)
          ]));
        }
        else if (type === 'cashier') {
          const sales = await Reports.loadSales(from, to);
          const list = Reports.cashierPerformance(sales);
          currentData = list;
          title.innerHTML = '<i class="fas fa-user-tie me-2"></i>Cashier Performance';
          setSummary([
            { label: 'Cashiers', value: list.length },
            { label: 'Total Sales', value: list.reduce((s, x) => s + x.count, 0) },
            { label: 'Revenue', value: Reports.formatCurrency(list.reduce((s, x) => s + x.revenue, 0)), cls: 'text-success' },
            { label: 'Profit', value: Reports.formatCurrency(list.reduce((s, x) => s + x.profit, 0)), cls: 'text-primary' }
          ]);
          csvHeaders = ['Cashier', 'Sales Count', 'Revenue', 'Profit'];
          csvRows = list.map(c => [c.name, c.count, c.revenue, c.profit]);
          content.innerHTML = buildTable(csvHeaders, list.map(c => [
            c.name, c.count, Reports.formatCurrency(c.revenue), Reports.formatCurrency(c.profit)
          ]));
        }
        else if (type === 'payment') {
          const sales = await Reports.loadSales(from, to);
          const list = Reports.paymentMethodReport(sales);
          currentData = list;
          title.innerHTML = '<i class="fas fa-credit-card me-2"></i>Sales by Payment Method';
          setSummary(list.map(m => ({
            label: m.method, value: Reports.formatCurrency(m.total) + ' (' + m.count + ')'
          })));
          csvHeaders = ['Payment Method', 'Count', 'Total'];
          csvRows = list.map(m => [m.method, m.count, m.total]);
          content.innerHTML = buildTable(csvHeaders, list.map(m => [
            m.method, m.count, Reports.formatCurrency(m.total)
          ]));
        }
        else if (type === 'purchases') {
          const purchases = await Reports.loadPurchases(from, to);
          currentData = purchases;
          title.innerHTML = '<i class="fas fa-truck me-2"></i>Purchase Report';
          const total = purchases.reduce((s, x) => s + (x.totalAmount || 0), 0);
          const paid = purchases.reduce((s, x) => s + (x.amountPaid || 0), 0);
          const bal = purchases.reduce((s, x) => s + (x.balance || 0), 0);
          setSummary([
            { label: 'Purchases', value: purchases.length },
            { label: 'Total', value: Reports.formatCurrency(total) },
            { label: 'Paid', value: Reports.formatCurrency(paid), cls: 'text-success' },
            { label: 'Outstanding', value: Reports.formatCurrency(bal), cls: 'text-danger' }
          ]);
          csvHeaders = ['Purchase #', 'Date', 'Supplier', 'Total', 'Paid', 'Balance', 'Status'];
          csvRows = purchases.map(p => [
            p.purchaseNumber, Reports.formatDateTime(p.createdAt), p.supplierName,
            p.totalAmount, p.amountPaid, p.balance || 0, p.status
          ]);
          content.innerHTML = buildTable(csvHeaders, purchases.map(p => [
            p.purchaseNumber, Reports.formatDate(p.createdAt), p.supplierName,
            Reports.formatCurrency(p.totalAmount), Reports.formatCurrency(p.amountPaid),
            Reports.formatCurrency(p.balance || 0), p.status
          ]));
        }
        else if (type === 'expenses') {
          const expenses = await Reports.loadExpenses(from, to);
          currentData = expenses;
          title.innerHTML = '<i class="fas fa-money-bill-wave me-2"></i>Expense Report';
          const total = expenses.reduce((s, x) => s + (x.amount || 0), 0);
          setSummary([
            { label: 'Records', value: expenses.length },
            { label: 'Total Expenses', value: Reports.formatCurrency(total), cls: 'text-danger' }
          ]);
          csvHeaders = ['Date', 'Category', 'Description', 'Amount', 'Payment', 'By'];
          csvRows = expenses.map(e => [
            Reports.formatDateTime(e.createdAt), e.category, e.description, e.amount, e.paymentMethod, e.createdByName
          ]);
          content.innerHTML = buildTable(csvHeaders, expenses.map(e => [
            Reports.formatDate(e.createdAt), e.category, e.description || '—',
            Reports.formatCurrency(e.amount), e.paymentMethod, e.createdByName || '—'
          ]));
        }
        else if (type === 'inventory') {
          const products = await Reports.loadProducts();
          const inv = Reports.inventoryValue(products);
          currentData = { products, inv };
          title.innerHTML = '<i class="fas fa-warehouse me-2"></i>Inventory Value Report';
          setSummary([
            { label: 'Products', value: inv.productCount },
            { label: 'Cost Value', value: Reports.formatCurrency(inv.costValue) },
            { label: 'Selling Value', value: Reports.formatCurrency(inv.sellValue), cls: 'text-success' },
            { label: 'Potential Profit', value: Reports.formatCurrency(inv.sellValue - inv.costValue), cls: 'text-primary' }
          ]);
          csvHeaders = ['Product', 'Qty', 'Unit', 'Cost Price', 'Selling Price', 'Cost Value', 'Sell Value'];
          csvRows = products.map(p => [
            p.name, p.quantity || 0, p.unit, p.costPrice, p.sellingPrice,
            (p.quantity || 0) * (p.costPrice || 0), (p.quantity || 0) * (p.sellingPrice || 0)
          ]);
          content.innerHTML = buildTable(csvHeaders, products.map(p => [
            p.name, p.quantity || 0, p.unit || 'pcs',
            Reports.formatCurrency(p.costPrice), Reports.formatCurrency(p.sellingPrice),
            Reports.formatCurrency((p.quantity || 0) * (p.costPrice || 0)),
            Reports.formatCurrency((p.quantity || 0) * (p.sellingPrice || 0))
          ]));
        }
        else if (type === 'lowstock') {
          const products = await Reports.loadProducts();
          const list = Reports.lowStockReport(products);
          currentData = list;
          title.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>Low Stock Report';
          setSummary([
            { label: 'Low / Out of Stock', value: list.length, cls: 'text-warning' },
            { label: 'Out of Stock', value: list.filter(p => (p.quantity || 0) <= 0).length, cls: 'text-danger' }
          ]);
          csvHeaders = ['Product', 'Qty', 'Min Stock', 'Unit', 'Status'];
          csvRows = list.map(p => [
            p.name, p.quantity || 0, p.minimumStock || 10, p.unit,
            (p.quantity || 0) <= 0 ? 'Out of Stock' : 'Low Stock'
          ]);
          content.innerHTML = buildTable(csvHeaders, list.map(p => [
            p.name, p.quantity || 0, p.minimumStock || 10, p.unit || 'pcs',
            (p.quantity || 0) <= 0 ? '<span class="badge bg-danger">Out</span>' : '<span class="badge bg-warning text-dark">Low</span>'
          ]));
        }
        else if (type === 'expiry') {
          const products = await Reports.loadProducts();
          const list = Reports.expiryReport(products);
          currentData = list;
          title.innerHTML = '<i class="fas fa-calendar-times me-2"></i>Expiry Report';
          setSummary([
            { label: 'Expiring / Expired', value: list.length },
            { label: 'Already Expired', value: list.filter(p => p.expired).length, cls: 'text-danger' },
            { label: 'Within 7 days', value: list.filter(p => !p.expired && p.daysLeft <= 7).length, cls: 'text-warning' }
          ]);
          csvHeaders = ['Product', 'Qty', 'Expiry Date', 'Days Left', 'Status'];
          csvRows = list.map(p => [
            p.name, p.quantity || 0, Reports.formatDate(p.expiryDate), p.daysLeft,
            p.expired ? 'Expired' : 'Expiring'
          ]);
          content.innerHTML = buildTable(csvHeaders, list.map(p => [
            p.name, p.quantity || 0, Reports.formatDate(p.expiryDate),
            p.daysLeft,
            p.expired ? '<span class="badge bg-danger">Expired</span>' :
              p.daysLeft <= 7 ? '<span class="badge bg-warning text-dark">' + p.daysLeft + 'd</span>' :
              '<span class="badge bg-info">' + p.daysLeft + 'd</span>'
          ]));
        }
        else if (type === 'customers') {
          const customers = await Reports.loadCustomers();
          currentData = customers;
          title.innerHTML = '<i class="fas fa-users me-2"></i>Customer Report';
          const withBalance = customers.filter(c => (c.balance || 0) > 0);
          setSummary([
            { label: 'Total Customers', value: customers.length },
            { label: 'With Outstanding', value: withBalance.length, cls: 'text-danger' },
            { label: 'Total Owed', value: Reports.formatCurrency(withBalance.reduce((s, c) => s + (c.balance || 0), 0)), cls: 'text-danger' }
          ]);
          csvHeaders = ['Name', 'Phone', 'Type', 'Credit Limit', 'Balance'];
          csvRows = customers.map(c => [c.name, c.phone, c.customerType, c.creditLimit, c.balance || 0]);
          content.innerHTML = buildTable(csvHeaders, customers.map(c => [
            c.name, c.phone || '—', c.customerType || 'retail',
            Reports.formatCurrency(c.creditLimit), Reports.formatCurrency(c.balance || 0)
          ]));
        }
        else if (type === 'suppliers') {
          const suppliers = await Reports.loadSuppliers();
          currentData = suppliers;
          title.innerHTML = '<i class="fas fa-industry me-2"></i>Supplier Report';
          const withBalance = suppliers.filter(s => (s.balance || 0) > 0);
          setSummary([
            { label: 'Total Suppliers', value: suppliers.length },
            { label: 'With Outstanding', value: withBalance.length },
            { label: 'Total Owed', value: Reports.formatCurrency(withBalance.reduce((s, x) => s + (x.balance || 0), 0)), cls: 'text-danger' }
          ]);
          csvHeaders = ['Business Name', 'Contact', 'Phone', 'Balance'];
          csvRows = suppliers.map(s => [s.businessName, s.contactPerson, s.phone, s.balance || 0]);
          content.innerHTML = buildTable(csvHeaders, suppliers.map(s => [
            s.businessName, s.contactPerson || '—', s.phone || '—', Reports.formatCurrency(s.balance || 0)
          ]));
        }
      } catch (err) {
        console.error(err);
        content.innerHTML = '<p class="text-danger text-center py-4">Failed to load report. Check console.</p>';
      }
    }

    function buildTable(headers, rows) {
      if (rows.length === 0) return '<p class="text-muted text-center py-4">No data for this period</p>';
      return '<table class="table table-hover table-sm mb-0 align-middle"><thead><tr>' +
        headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>';
    }

    function exportCSV() {
      if (!csvRows.length) return alert('Run a report first');
      const type = document.getElementById('reportType').value;
      const date = new Date().toISOString().slice(0, 10);
      Reports.downloadCSV('CF_' + type + '_' + date + '.csv', csvHeaders, csvRows);
    }

    function printCurrent() {
      const title = document.getElementById('reportTitle').textContent;
      const content = document.getElementById('reportContent').innerHTML;
      const summary = document.getElementById('summaryCards').innerHTML;
      Reports.printReport(title, '<div class="row">' + summary + '</div>' + content);
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
