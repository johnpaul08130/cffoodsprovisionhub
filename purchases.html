<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchases - CF Foods and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h5 class="mb-0">Purchases</h5>
          <small class="text-muted">Buy stock from suppliers</small>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#newPurchaseModal" onclick="openNewPurchase()">
          <i class="fas fa-plus me-1"></i> New Purchase
        </button>
      </div>

      <!-- Summary -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Total Purchases</div>
            <div class="stat-value" id="sumCount">0</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Total Amount</div>
            <div class="stat-value text-primary" id="sumTotal">₦0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Amount Paid</div>
            <div class="stat-value text-success" id="sumPaid">₦0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-label">Outstanding</div>
            <div class="stat-value text-danger" id="sumBalance">₦0.00</div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="card-header d-flex justify-content-between">
          <span><i class="fas fa-truck me-2"></i>Purchase History</span>
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search..." style="max-width:200px;">
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>Purchase #</th>
                <th>Date</th>
                <th>Supplier</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Status</th>
                <th>By</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="9" class="text-center py-4 text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== NEW PURCHASE MODAL ==================== -->
  <div class="modal fade" id="newPurchaseModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">New Purchase</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="purchaseAlert" class="alert d-none"></div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Supplier *</label>
              <select class="form-select" id="supplierSelect">
                <option value="">— Select Supplier —</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Add Product</label>
              <div class="input-group">
                <select class="form-select" id="productSelect">
                  <option value="">— Select Product —</option>
                </select>
                <button class="btn btn-outline-success" type="button" onclick="addProductToCart()">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Cart -->
          <div class="table-responsive mb-3">
            <table class="table table-sm table-bordered">
              <thead class="table-light">
                <tr>
                  <th>Product</th>
                  <th style="width:100px">Qty</th>
                  <th style="width:120px">Unit Cost (₦)</th>
                  <th style="width:120px">Total</th>
                  <th style="width:50px"></th>
                </tr>
              </thead>
              <tbody id="cartBody">
                <tr><td colspan="5" class="text-center text-muted">No items yet</td></tr>
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="3" class="text-end fw-bold">Grand Total</td>
                  <td class="fw-bold text-success" id="cartTotal">₦0.00</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>

          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Amount Paid (₦)</label>
              <input type="number" class="form-control" id="amountPaid" min="0" step="0.01" value="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="paymentMethod">
                <option value="cash">Cash</option>
                <option value="bank_transfer">Bank Transfer</option>
                <option value="pos">POS</option>
                <option value="credit">Credit</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Notes</label>
              <input type="text" class="form-control" id="purchaseNotes" placeholder="Optional notes...">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="completePurchaseBtn" onclick="completePurchase()">
            <i class="fas fa-check me-1"></i> Complete Purchase
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Purchase Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailContent"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/purchases.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init(['admin', 'manager']);
      Layout.render('purchases');
      Layout.setPageTitle('Purchases');
      await loadAll();
    });

    async function loadAll() {
      await Promise.all([
        Purchases.loadPurchases(),
        Purchases.loadSuppliers(),
        Purchases.loadProducts()
      ]);
      renderTable(Purchases.all);
      updateSummary(Purchases.all);
      populateSelects();
    }

    function updateSummary(list) {
      document.getElementById('sumCount').textContent = list.length;
      const total = list.reduce((s, x) => s + (x.totalAmount || 0), 0);
      const paid = list.reduce((s, x) => s + (x.amountPaid || 0), 0);
      const bal = list.reduce((s, x) => s + (x.balance || 0), 0);
      document.getElementById('sumTotal').textContent = Purchases.formatCurrency(total);
      document.getElementById('sumPaid').textContent = Purchases.formatCurrency(paid);
      document.getElementById('sumBalance').textContent = Purchases.formatCurrency(bal);
    }

    function renderTable(list) {
      const tbody = document.getElementById('tableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">No purchases yet</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(p => {
        const bal = p.balance || 0;
        const status = p.status || (bal > 0 ? 'partial' : 'completed');
        const badge = status === 'completed' ? 'bg-success' : 'bg-warning text-dark';
        return `
          <tr>
            <td class="fw-semibold">${p.purchaseNumber || '—'}</td>
            <td class="small">${Purchases.formatDate(p.createdAt)}</td>
            <td>${p.supplierName || '—'}</td>
            <td>${Purchases.formatCurrency(p.totalAmount)}</td>
            <td>${Purchases.formatCurrency(p.amountPaid)}</td>
            <td class="${bal > 0 ? 'text-danger fw-bold' : ''}">${Purchases.formatCurrency(bal)}</td>
            <td><span class="badge ${badge}">${status}</span></td>
            <td class="small">${p.createdByName || '—'}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1" onclick="viewPurchase('${p.id}')"><i class="fas fa-eye"></i></button>
              ${bal > 0 ? `<button class="btn btn-sm btn-success" onclick="settlePurchase('${p.id}')"><i class="fas fa-money-bill"></i></button>` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = Purchases.all.filter(p =>
        (p.purchaseNumber || '').toLowerCase().includes(q) ||
        (p.supplierName || '').toLowerCase().includes(q)
      );
      renderTable(filtered);
    });

    function populateSelects() {
      document.getElementById('supplierSelect').innerHTML =
        '<option value="">— Select Supplier —</option>' +
        Purchases.suppliers.map(s => `<option value="${s.id}">${s.businessName}</option>`).join('');

      document.getElementById('productSelect').innerHTML =
        '<option value="">— Select Product —</option>' +
        Purchases.products.map(p => `<option value="${p.id}" data-cost="${p.costPrice || 0}">${p.name} (${p.unit || 'pcs'})</option>`).join('');
    }

    function openNewPurchase() {
      Purchases.clearCart();
      renderCart();
      document.getElementById('purchaseAlert').classList.add('d-none');
      document.getElementById('amountPaid').value = 0;
      document.getElementById('purchaseNotes').value = '';
      document.getElementById('supplierSelect').value = '';
    }

    function addProductToCart() {
      const sel = document.getElementById('productSelect');
      const id = sel.value;
      if (!id) return alert('Select a product');
      const product = Purchases.products.find(p => p.id === id);
      if (!product) return;
      const cost = parseFloat(sel.options[sel.selectedIndex].getAttribute('data-cost')) || product.costPrice || 0;
      Purchases.addToCart(product, 1, cost);
      renderCart();
      sel.value = '';
    }

    function renderCart() {
      const tbody = document.getElementById('cartBody');
      if (Purchases.cart.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No items yet</td></tr>';
      } else {
        tbody.innerHTML = Purchases.cart.map(item => `
          <tr>
            <td>${item.productName} <small class="text-muted">(${item.unit})</small></td>
            <td>
              <input type="number" class="form-control form-control-sm" value="${item.quantity}" min="1"
                     onchange="updateItem('${item.productId}', this.value, ${item.unitCost})">
            </td>
            <td>
              <input type="number" class="form-control form-control-sm" value="${item.unitCost}" min="0" step="0.01"
                     onchange="updateItem('${item.productId}', ${item.quantity}, this.value)">
            </td>
            <td>${Purchases.formatCurrency(item.lineTotal)}</td>
            <td>
              <button class="btn btn-sm btn-outline-danger" onclick="removeItem('${item.productId}')">
                <i class="fas fa-times"></i>
              </button>
            </td>
          </tr>
        `).join('');
      }
      document.getElementById('cartTotal').textContent = Purchases.formatCurrency(Purchases.getTotal());
    }

    function updateItem(productId, qty, cost) {
      Purchases.updateCartItem(productId, parseInt(qty) || 1, parseFloat(cost) || 0);
      renderCart();
    }

    function removeItem(productId) {
      Purchases.removeFromCart(productId);
      renderCart();
    }

    async function completePurchase() {
      const supplierId = document.getElementById('supplierSelect').value;
      const supplierName = document.getElementById('supplierSelect').selectedOptions[0]?.text || '';
      const amountPaid = document.getElementById('amountPaid').value;
      const paymentMethod = document.getElementById('paymentMethod').value;
      const notes = document.getElementById('purchaseNotes').value;
      const alertBox = document.getElementById('purchaseAlert');

      const btn = document.getElementById('completePurchaseBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Processing...';

      const result = await Purchases.completePurchase({
        supplierId,
        supplierName,
        amountPaid,
        paymentMethod,
        notes
      });

      alertBox.className = `alert alert-${result.success ? 'success' : 'danger'}`;
      alertBox.textContent = result.message + (result.balance > 0 ? ` Outstanding: ${Purchases.formatCurrency(result.balance)}` : '');
      alertBox.classList.remove('d-none');

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check me-1"></i> Complete Purchase';

      if (result.success) {
        await loadAll();
        setTimeout(() => {
          bootstrap.Modal.getInstance(document.getElementById('newPurchaseModal'))?.hide();
        }, 1000);
      }
    }

    function viewPurchase(id) {
      const p = Purchases.all.find(x => x.id === id);
      if (!p) return;
      const items = p.items || [];
      const bal = p.balance || 0;
      document.getElementById('detailContent').innerHTML = `
        <div class="row mb-3">
          <div class="col-md-6">
            <p class="mb-1"><strong>Purchase #:</strong> ${p.purchaseNumber}</p>
            <p class="mb-1"><strong>Date:</strong> ${Purchases.formatDate(p.createdAt)}</p>
            <p class="mb-1"><strong>Supplier:</strong> ${p.supplierName}</p>
            <p class="mb-1"><strong>Recorded by:</strong> ${p.createdByName || '—'}</p>
          </div>
          <div class="col-md-6">
            <p class="mb-1"><strong>Total:</strong> ${Purchases.formatCurrency(p.totalAmount)}</p>
            <p class="mb-1"><strong>Paid:</strong> ${Purchases.formatCurrency(p.amountPaid)}</p>
            <p class="mb-1"><strong>Balance:</strong> <span class="${bal > 0 ? 'text-danger fw-bold' : 'text-success'}">${Purchases.formatCurrency(bal)}</span></p>
            <p class="mb-1"><strong>Payment:</strong> ${p.paymentMethod}</p>
            <p class="mb-1"><strong>Status:</strong> ${p.status}</p>
          </div>
        </div>
        <table class="table table-sm">
          <thead><tr><th>Product</th><th>Qty</th><th>Unit Cost</th><th>Total</th></tr></thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.productName}</td>
                <td>${i.quantity} ${i.unit || ''}</td>
                <td>${Purchases.formatCurrency(i.unitCost)}</td>
                <td>${Purchases.formatCurrency(i.lineTotal)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${bal > 0 ? `<div class="text-end mt-2">
          <button class="btn btn-success" onclick="bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide(); settlePurchase('${p.id}')">
            <i class="fas fa-money-bill me-1"></i> Pay Outstanding Balance
          </button>
        </div>` : ''}
      `;
      new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    async function settlePurchase(id) {
      const p = Purchases.all.find(x => x.id === id);
      if (!p || !(p.balance > 0)) return;
      const input = prompt(`Outstanding: ${Purchases.formatCurrency(p.balance)}\n\nEnter amount paying now:`, p.balance);
      if (input === null) return;
      const result = await Purchases.settleBalance(id, input);
      alert(result.message);
      if (result.success) await loadAll();
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
