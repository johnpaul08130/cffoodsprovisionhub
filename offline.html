<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - CF Food and Beverages</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a3a2a 0%, #2d5a3d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: white;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 400px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    p { opacity: 0.9; line-height: 1.5; }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.5rem;
    }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are Offline</h1>
    <p>
      CF Food and Beverages needs an internet connection for some features.
      Please check your network and try again.
    </p>
    <p style="font-size:0.9rem; opacity:0.75;">
      Pages and data you already opened may still be available.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
