<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - CF Foods and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h5 class="mb-0">Customers</h5>
          <small class="text-muted">Manage your customers</small>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#customerModal" onclick="openAdd()">
          <i class="fas fa-user-plus me-1"></i> Add Customer
        </button>
      </div>

      <div class="table-card mb-3">
        <div class="p-3">
          <input type="text" class="form-control" id="searchInput" placeholder="Search by name, phone, email...">
        </div>
      </div>

      <div class="table-card">
        <div class="card-header d-flex justify-content-between">
          <span><i class="fas fa-users me-2"></i>Customer List <span class="badge bg-secondary" id="countBadge">0</span></span>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Type</th>
                <th>Credit Limit</th>
                <th>Balance</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Customer Modal -->
  <div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formAlert" class="alert d-none"></div>
          <form id="customerForm">
            <input type="hidden" id="customerId">
            <div class="mb-3">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="cName" required>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" id="cPhone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="cEmail">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="cAddress" rows="2"></textarea>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label">Customer Type</label>
                <select class="form-select" id="cType">
                  <option value="retail">Retail</option>
                  <option value="wholesale">Wholesale</option>
                  <option value="credit">Credit</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Credit Limit (₦)</label>
                <input type="number" class="form-control" id="cCredit" min="0" value="0">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="saveBtn">Save Customer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Purchase History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="historyContent">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/customers.js"></script>
  <script>
    let editingId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      Layout.render('customers');
      Layout.setPageTitle('Customers');
      await load();
    });

    async function load() {
      await Customers.load();
      render(Customers.all);
    }

    function render(list) {
      document.getElementById('countBadge').textContent = list.length;
      const tbody = document.getElementById('tableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No customers yet</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(c => `
        <tr>
          <td class="fw-semibold">${c.name}</td>
          <td>${c.phone || '—'}</td>
          <td>${c.email || '—'}</td>
          <td><span class="badge bg-secondary">${c.customerType || 'retail'}</span></td>
          <td>${Customers.formatCurrency(c.creditLimit)}</td>
          <td class="${(c.balance || 0) > 0 ? 'text-danger fw-semibold' : ''}">${Customers.formatCurrency(c.balance)}</td>
          <td>
            <button class="btn btn-sm btn-outline-info me-1" onclick="viewHistory('${c.id}', '${(c.name || '').replace(/'/g, "\\'")}')" title="History">
              <i class="fas fa-history"></i>
            </button>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit('${c.id}')" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="remove('${c.id}', '${(c.name || '').replace(/'/g, "\\'")}')" data-role="admin,manager" title="Delete">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
      Auth.updateUI();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = Customers.all.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.phone || '').includes(q) ||
        (c.email || '').toLowerCase().includes(q)
      );
      render(filtered);
    });

    function openAdd() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Customer';
      document.getElementById('customerForm').reset();
      document.getElementById('customerId').value = '';
      document.getElementById('formAlert').classList.add('d-none');
      document.getElementById('cCredit').value = 0;
    }

    function openEdit(id) {
      const c = Customers.all.find(x => x.id === id);
      if (!c) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Customer';
      document.getElementById('customerId').value = id;
      document.getElementById('cName').value = c.name || '';
      document.getElementById('cPhone').value = c.phone || '';
      document.getElementById('cEmail').value = c.email || '';
      document.getElementById('cAddress').value = c.address || '';
      document.getElementById('cType').value = c.customerType || 'retail';
      document.getElementById('cCredit').value = c.creditLimit || 0;
      document.getElementById('formAlert').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('customerModal')).show();
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const name = document.getElementById('cName').value.trim();
      if (!name) {
        showFormAlert('Name is required.', 'danger');
        return;
      }
      const data = {
        name,
        phone: document.getElementById('cPhone').value,
        email: document.getElementById('cEmail').value,
        address: document.getElementById('cAddress').value,
        customerType: document.getElementById('cType').value,
        creditLimit: document.getElementById('cCredit').value
      };
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const result = editingId
        ? await Customers.update(editingId, data)
        : await Customers.create(data);

      showFormAlert(result.message, result.success ? 'success' : 'danger');
      btn.disabled = false;
      btn.textContent = 'Save Customer';

      if (result.success) {
        await load();
        setTimeout(() => bootstrap.Modal.getInstance(document.getElementById('customerModal'))?.hide(), 700);
      }
    });

    function showFormAlert(msg, type) {
      const el = document.getElementById('formAlert');
      el.className = `alert alert-${type}`;
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    async function remove(id, name) {
      if (!confirm(`Delete customer "${name}"?`)) return;
      const result = await Customers.delete(id, name);
      alert(result.message);
      if (result.success) await load();
    }

    async function viewHistory(id, name) {
      document.getElementById('historyContent').innerHTML = 'Loading...';
      new bootstrap.Modal(document.getElementById('historyModal')).show();
      try {
        const sales = await Customers.getPurchaseHistory(id);
        if (sales.length === 0) {
          document.getElementById('historyContent').innerHTML = `<p class="text-muted">No purchases found for <strong>${name}</strong>.</p>`;
          return;
        }
        document.getElementById('historyContent').innerHTML = `
          <p class="mb-2">Purchase history for <strong>${name}</strong></p>
          <table class="table table-sm">
            <thead><tr><th>Receipt</th><th>Date</th><th>Total</th><th>Payment</th></tr></thead>
            <tbody>
              ${sales.map(s => `
                <tr>
                  <td>${s.transactionNumber || '—'}</td>
                  <td>${s.createdAt?.toDate ? s.createdAt.toDate().toLocaleDateString('en-NG') : '—'}</td>
                  <td>${Customers.formatCurrency(s.totalAmount)}</td>
                  <td>${s.paymentMethod || '—'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        document.getElementById('historyContent').innerHTML = '<p class="text-danger">Failed to load history.</p>';
      }
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
