<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - CF Food and Beverages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    .pos-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1rem;
      height: calc(100vh - 120px);
    }
    @media (max-width: 991px) {
      .pos-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      overflow-y: auto;
      max-height: 100%;
      padding-bottom: 1rem;
    }
    .pos-product-card {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .pos-product-card:hover {
      border-color: #28a745;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(40,167,69,0.15);
    }
    .pos-product-card .prod-name {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      line-height: 1.2;
      height: 2.4em;
      overflow: hidden;
    }
    .pos-product-card .prod-price {
      color: #28a745;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .pos-product-card .prod-stock {
      font-size: 0.75rem;
      color: #6c757d;
    }
    .pos-product-card.out-of-stock {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .cart-panel {
      background: white;
      border-radius: 12px;
      border: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .cart-summary {
      border-top: 2px solid #e9ecef;
      padding: 1rem;
      background: #f8f9fa;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 0.85rem;
    }
    #barcodeInput:focus {
      border-color: #28a745;
      box-shadow: 0 0 0 0.2rem rgba(40,167,69,0.25);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div id="app">
    <div id="content" style="display:none;">
      <div class="pos-layout">
        <!-- LEFT: Products -->
        <div>
          <div class="d-flex gap-2 mb-3">
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-barcode"></i></span>
              <input type="text" class="form-control form-control-lg" id="barcodeInput" 
                     placeholder="Scan barcode or search product..." autofocus>
            </div>
          </div>
          <div class="product-grid" id="productGrid">
            <div class="text-muted text-center py-5 w-100">Loading products...</div>
          </div>
        </div>

        <!-- RIGHT: Cart -->
        <div class="cart-panel">
          <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
            <h6 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Cart <span class="badge bg-success" id="cartCount">0</span></h6>
            <button class="btn btn-sm btn-outline-danger" onclick="clearCart()" title="Clear cart">
              <i class="fas fa-trash"></i>
            </button>
          </div>

          <div class="cart-items" id="cartItems">
            <div class="text-center text-muted py-5">
              <i class="fas fa-shopping-basket fa-2x mb-2 d-block"></i>
              Cart is empty
            </div>
          </div>

          <div class="cart-summary">
            <div class="d-flex justify-content-between mb-1">
              <span>Subtotal</span>
              <span id="subtotalDisplay">₦0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-1 align-items-center">
              <span>Discount</span>
              <div class="d-flex gap-1 align-items-center">
                <input type="number" class="form-control form-control-sm" id="discountInput" 
                       value="0" min="0" style="width:70px;" onchange="applyDiscount()">
                <select class="form-select form-select-sm" id="discountType" style="width:70px;" onchange="applyDiscount()">
                  <option value="amount">₦</option>
                  <option value="percent">%</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted small">Discount Amount</span>
              <span class="text-danger" id="discountDisplay">-₦0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <strong class="fs-5">Total</strong>
              <strong class="fs-5 text-success" id="totalDisplay">₦0.00</strong>
            </div>

            <!-- Customer (optional but required for credit/partial) -->
            <div class="mb-2">
              <label class="form-label small fw-semibold">Customer (for credit / part payment)</label>
              <select class="form-select form-select-sm" id="customerSelect">
                <option value="">Walk-in Customer</option>
              </select>
            </div>

            <!-- Payment -->
            <div class="mb-2">
              <label class="form-label small fw-semibold">Payment Method</label>
              <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="payMethod" id="payCash" value="cash" checked>
                <label class="btn btn-outline-success btn-sm" for="payCash">Cash</label>
                <input type="radio" class="btn-check" name="payMethod" id="payTransfer" value="bank_transfer">
                <label class="btn btn-outline-success btn-sm" for="payTransfer">Transfer</label>
                <input type="radio" class="btn-check" name="payMethod" id="payPOS" value="pos">
                <label class="btn btn-outline-success btn-sm" for="payPOS">POS</label>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small fw-semibold">Amount Paid (₦)</label>
              <input type="number" class="form-control" id="amountPaid" min="0" step="0.01" 
                     oninput="updateChange()" placeholder="Enter amount customer paid">
              <div class="form-text">Leave empty or enter less than total for part payment / credit</div>
            </div>
            <div class="d-flex justify-content-between mb-1">
              <span>Change</span>
              <strong id="changeDisplay">₦0.00</strong>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-danger">Balance (to pay later)</span>
              <strong class="text-danger" id="balanceDisplay">₦0.00</strong>
            </div>

            <button class="btn btn-success btn-lg w-100" id="checkoutBtn" onclick="checkout()">
              <i class="fas fa-check-circle me-2"></i> Complete Sale
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div class="modal fade" id="receiptModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title">Sale Completed</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="receiptContent">
          <!-- Receipt injected here -->
        </div>
        <div class="modal-footer no-print">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-success" onclick="printReceipt()">
            <i class="fas fa-print me-1"></i> Print Receipt
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/receipt.js"></script>
  <script>
    let lastReceipt = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      Layout.render('pos');
      Layout.setPageTitle('Point of Sale');
      await POS.loadProducts();
      await POS.loadCustomers();
      populateCustomers();
      renderProducts(POS.products.slice(0, 40));

      // Barcode / search
      const barcodeInput = document.getElementById('barcodeInput');
      barcodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleBarcodeOrSearch();
        }
      });
      barcodeInput.addEventListener('input', () => {
        const q = barcodeInput.value.trim();
        if (q.length >= 2) {
          renderProducts(POS.searchProducts(q));
        } else if (q.length === 0) {
          renderProducts(POS.products.slice(0, 40));
        }
      });

      // Payment method
      document.querySelectorAll('input[name="payMethod"]').forEach(el => {
        el.addEventListener('change', () => {
          POS.paymentMethod = el.value;
        });
      });
    });

    function renderProducts(list) {
      const grid = document.getElementById('productGrid');
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="text-muted text-center py-5 w-100">No products found</div>';
        return;
      }
      grid.innerHTML = list.map(p => {
        const out = (p.quantity || 0) <= 0;
        return `
          <div class="pos-product-card ${out ? 'out-of-stock' : ''}" 
               onclick="${out ? '' : `addProduct('${p.id}')`}">
            <div class="prod-name">${p.name}</div>
            <div class="prod-price">${POS.formatCurrency(p.sellingPrice)}</div>
            <div class="prod-stock">${out ? 'Out of stock' : `${p.quantity} ${p.unit || 'pcs'}`}</div>
          </div>
        `;
      }).join('');
    }

    function addProduct(id) {
      const product = POS.products.find(p => p.id === id);
      if (!product) return;
      const result = POS.addToCart(product, 1);
      if (!result.success) {
        alert(result.message);
        return;
      }
      renderCart();
      document.getElementById('barcodeInput').value = '';
      document.getElementById('barcodeInput').focus();
    }

    function handleBarcodeOrSearch() {
      const q = document.getElementById('barcodeInput').value.trim();
      if (!q) return;

      // Exact barcode match first
      const byBarcode = POS.findByBarcode(q);
      if (byBarcode) {
        const result = POS.addToCart(byBarcode, 1);
        if (!result.success) alert(result.message);
        else {
          renderCart();
          document.getElementById('barcodeInput').value = '';
        }
        return;
      }

      // Otherwise search
      const results = POS.searchProducts(q);
      renderProducts(results);
      if (results.length === 1) {
        const result = POS.addToCart(results[0], 1);
        if (!result.success) alert(result.message);
        else {
          renderCart();
          document.getElementById('barcodeInput').value = '';
        }
      }
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      document.getElementById('cartCount').textContent = POS.cart.length;

      if (POS.cart.length === 0) {
        container.innerHTML = `
          <div class="text-center text-muted py-5">
            <i class="fas fa-shopping-basket fa-2x mb-2 d-block"></i>
            Cart is empty
          </div>`;
      } else {
        container.innerHTML = POS.cart.map(item => `
          <div class="cart-item">
            <div class="flex-grow-1">
              <div class="fw-semibold small">${item.productName}</div>
              <div class="text-muted" style="font-size:0.75rem;">
                ${POS.formatCurrency(item.unitPrice)} × ${item.unit || 'pcs'}
              </div>
            </div>
            <div class="d-flex align-items-center gap-1">
              <button class="btn btn-outline-secondary qty-btn" onclick="changeQty('${item.productId}', -1)">−</button>
              <span class="fw-bold" style="min-width:24px;text-align:center;">${item.quantity}</span>
              <button class="btn btn-outline-secondary qty-btn" onclick="changeQty('${item.productId}', 1)">+</button>
            </div>
            <div class="text-end" style="min-width:70px;">
              <div class="fw-semibold small">${POS.formatCurrency(item.lineTotal)}</div>
              <button class="btn btn-link btn-sm text-danger p-0" onclick="removeItem('${item.productId}')">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        `).join('');
      }

      updateTotals();
    }

    function changeQty(productId, delta) {
      const item = POS.cart.find(i => i.productId === productId);
      if (!item) return;
      POS.updateCartQty(productId, item.quantity + delta);
      renderCart();
    }

    function removeItem(productId) {
      POS.removeFromCart(productId);
      renderCart();
    }

    function clearCart() {
      if (POS.cart.length && !confirm('Clear the cart?')) return;
      POS.clearCart();
      renderCart();
      document.getElementById('amountPaid').value = '';
      document.getElementById('discountInput').value = 0;
    }

    function applyDiscount() {
      const val = parseFloat(document.getElementById('discountInput').value) || 0;
      const type = document.getElementById('discountType').value;
      if (type === 'percent') {
        POS.discountPercent = Math.min(100, Math.max(0, val));
        POS.discountAmount = 0;
      } else {
        POS.discountAmount = Math.max(0, val);
        POS.discountPercent = 0;
      }
      updateTotals();
    }

    function updateTotals() {
      document.getElementById('subtotalDisplay').textContent = POS.formatCurrency(POS.getSubtotal());
      document.getElementById('discountDisplay').textContent = '-' + POS.formatCurrency(POS.getDiscountTotal());
      document.getElementById('totalDisplay').textContent = POS.formatCurrency(POS.getTotal());
      updateChange();
    }

    function populateCustomers() {
      const sel = document.getElementById('customerSelect');
      if (!sel) return;
      sel.innerHTML = '<option value="">Walk-in Customer</option>' +
        POS.customers.map(c => `<option value="${c.id}">${c.name}${c.phone ? ' ('+c.phone+')' : ''}</option>`).join('');
      sel.addEventListener('change', () => {
        const id = sel.value;
        POS.selectedCustomer = id ? POS.customers.find(c => c.id === id) : null;
      });
    }

    function updateChange() {
      POS.amountPaid = parseFloat(document.getElementById('amountPaid').value) || 0;
      const total = POS.getTotal();
      const paid = POS.amountPaid;
      const change = Math.max(0, paid - total);
      const balance = Math.max(0, total - paid);
      document.getElementById('changeDisplay').textContent = POS.formatCurrency(change);
      const balEl = document.getElementById('balanceDisplay');
      if (balEl) balEl.textContent = POS.formatCurrency(balance);
    }

    async function checkout() {
      if (POS.cart.length === 0) {
        alert('Cart is empty.');
        return;
      }

      // Auto-set amount paid to total if empty
      if (!document.getElementById('amountPaid').value) {
        document.getElementById('amountPaid').value = POS.getTotal().toFixed(2);
        POS.amountPaid = POS.getTotal();
      }

      const btn = document.getElementById('checkoutBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

      const result = await POS.completeSale();

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check-circle me-2"></i> Complete Sale';

      if (result.success) {
        lastReceipt = result.receipt;
        showReceipt(result.receipt);
        renderCart();
        // Refresh product quantities
        await POS.loadProducts();
        renderProducts(POS.products.slice(0, 40));
        document.getElementById('amountPaid').value = '';
        document.getElementById('discountInput').value = 0;
        document.getElementById('barcodeInput').focus();
      } else {
        alert(result.message);
      }
    }

    function showReceipt(r) {
      lastReceipt = r;
      document.getElementById('receiptContent').innerHTML = Receipt.buildHTML(r, false);
      new bootstrap.Modal(document.getElementById('receiptModal')).show();
    }

    function printReceipt() {
      if (!lastReceipt) {
        // Fallback: print whatever is in the modal
        const content = document.getElementById('receiptContent').innerHTML;
        const win = window.open('', '_blank', 'width=320,height=600');
        if (!win) return alert('Please allow pop-ups to print.');
        win.document.write('<html><head><title>Receipt</title><style>body{font-family:monospace;font-size:12px;width:280px;margin:0 auto;padding:10px;} table{width:100%;border-collapse:collapse;} @media print{body{width:80mm;} @page{margin:0;size:80mm auto;}}</style></head><body>' + content + '<script>window.onload=function(){window.print();}<\/script></body></html>');
        win.document.close();
        return;
      }
      Receipt.print(lastReceipt);
    }
  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").then(function(reg) {
      console.log("SW registered", reg.scope);
    }).catch(function(err) {
      console.log("SW registration failed", err);
    });
  }
</script>
</body>
</html>
