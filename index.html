<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF Foods and Beverages - ProvisionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a3a2a 0%, #2d5a3d 50%, #1a3a2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .hero-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
      text-align: center;
    }
    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #28a745, #20c997);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
      color: white;
      box-shadow: 0 8px 20px rgba(40,167,69,0.4);
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      padding: 12px 30px;
      font-weight: 600;
      border-radius: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(40,167,69,0.4);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>
  <div class="hero-card">
    <div class="logo-icon">
      <i class="fas fa-store"></i>
    </div>
    <h1 class="fw-bold mb-2" style="color:#1a3a2a;">CF Foods and Beverages</h1>
    <p class="text-muted mb-1">Nkwo Okija, Ihiala LGA, Anambra State</p>
    <p class="text-muted mb-4"><i class="fas fa-phone me-1"></i> 08062686710</p>
    <p class="small text-secondary mb-4">Powered by JPSoftware ProvisionHub</p>
    
    <div class="d-grid gap-3">
      <a href="login.html" class="btn btn-primary-custom btn-lg text-white">
        <i class="fas fa-sign-in-alt me-2"></i> Login to Dashboard
      </a>
    </div>
    
    <hr class="my-4">
    
    <div class="row text-center g-3">
      <div class="col-4">
        <i class="fas fa-cash-register fa-2x text-success mb-2"></i>
        <div class="small text-muted">POS System</div>
      </div>
      <div class="col-4">
        <i class="fas fa-boxes fa-2x text-success mb-2"></i>
        <div class="small text-muted">Inventory</div>
      </div>
      <div class="col-4">
        <i class="fas fa-chart-line fa-2x text-success mb-2"></i>
        <div class="small text-muted">Reports</div>
      </div>
    </div>
    
    <p class="mt-4 mb-0 small text-muted">
      Powered by JPSoftware• Secure Cloud Storage
    </p>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    // Redirect if already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").then(function(reg) {
      console.log("SW registered", reg.scope);
    }).catch(function(err) {
      console.log("SW registration failed", err);
    });
  }
</script>
</body>
</html>
